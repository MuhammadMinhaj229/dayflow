name: DayFlow quality gates

on:
  push:
    branches:
      - main
      - "architecture/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dayflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Type, lint, unit, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e

  android-debug:
    name: Android native debug build
    needs: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.2.2
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36 platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate and register Capacitor Android project
        run: npm run android:bootstrap
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build Android debug APK
        run: cd android && ./gradlew --no-daemon --stacktrace :app:assembleDebug
