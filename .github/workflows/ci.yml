name: DayFlow quality gates

on:
  push:
    branches:
      - main
      - "architecture/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dayflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Type, lint, unit, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Commit the first generated npm lockfile
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/architecture/')
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::npm did not generate package-lock.json"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): commit reproducible npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
