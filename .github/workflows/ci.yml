name: DayFlow quality gates

on:
  push:
    branches:
      - main
      - "architecture/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dayflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Type, lint, unit, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=low
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e

  android-debug:
    name: Android native debug build
    needs: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v7
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses >/dev/null
      - name: Install Android API 36 platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Android emulator image
        run: sdkmanager "emulator" "system-images;android-36;google_apis;x86_64"
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate and register Capacitor Android project
        run: npm run android:bootstrap
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build Android debug APK
        run: cd android && ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Create Android emulator
        run: |
          echo "no" | avdmanager create avd --force -n dayflow-ci -k "system-images;android-36;google_apis;x86_64" -d pixel_2
      - name: Boot Android emulator
        run: |
          emulator -avd dayflow-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -no-metrics > "$RUNNER_TEMP/dayflow-emulator.log" 2>&1 &
          adb wait-for-device
          booted=""
          for attempt in $(seq 1 180); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')"
            if [ "$booted" = "1" ]; then break; fi
            sleep 2
          done
          if [ "$booted" != "1" ]; then
            cat "$RUNNER_TEMP/dayflow-emulator.log"
            echo "Android emulator did not finish booting."
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Install, launch and verify Android app workspace
        run: |
          adb logcat -c
          adb install android/app/build/outputs/apk/debug/app-debug.apk
          adb shell monkey -p com.dayflow.app 1
          launched=""
          for attempt in $(seq 1 60); do
            if adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | grep -q 'com.dayflow.app'; then
              launched="yes"
              break
            fi
            sleep 2
          done
          if [ "$launched" != "yes" ]; then
            adb logcat -d -t 4000
            echo "DayFlow did not reach the foreground on Android."
            exit 1
          fi
          workspace=""
          for attempt in $(seq 1 60); do
            if adb shell run-as com.dayflow.app sh -c 'test -d files/DayFlow/backups && test -d files/DayFlow/exports && test -d files/DayFlow/imports && test -d files/DayFlow/attachments && test -d files/DayFlow/diagnostics && test -d files/DayFlow/update-manifests'; then
              workspace="ready"
              break
            fi
            sleep 2
          done
          if [ "$workspace" != "ready" ]; then
            adb logcat -d -t 4000
            echo "DayFlow did not create its six private workspace directories."
            exit 1
          fi
          if adb logcat -d -t 6000 | grep -E 'FATAL EXCEPTION|Fatal signal'; then
            echo "Android reported a fatal exception during DayFlow startup."
            exit 1
          fi
      - name: Stop Android emulator
        if: always()
        run: |
          adb emu kill || true
      - name: Generate APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload Android debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dayflow-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
